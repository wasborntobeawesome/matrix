<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Promo renderer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 1080x1920 stage. Every visual property is computed from time t by
     window.seek(t) in app.js, so render.py can capture any frame exactly. -->
<div id="stage">
  <div id="bg">
    <div class="blob" id="blobA"></div>
    <div class="blob" id="blobB"></div>
    <div class="blob" id="blobC"></div>
    <div id="grid"></div>
    <div id="particles"></div>
    <div id="vignette"></div>
  </div>
  <div id="brand">
    <div class="logo"><div class="logo-bars"></div></div>
    <div class="brand-name"></div>
  </div>
  <div id="scenes"></div>
  <div id="captions"></div>
  <div id="progress"></div>
</div>
<div id="play-hint">click to play</div>
<!-- data.js (window.TIMELINE + window.AUDIO) is written by render.py. Default
     build/data.js; ?data=<url> loads another one of the same origin (render.py serves it);
     ?embed loads nothing and waits for a timeline from the parent page (studio live preview:
     postMessage, see the bridge at the end of app.js). -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has("embed")) return;
  // only a same-origin data script: /renderer/index.html?data=https://elsewhere/x.js must never run
  // someone else's code on the studio's origin
  var u;
  try { u = new URL(q.get("data") || "build/data.js", location.href); } catch (e) { return; }
  if (u.origin !== location.origin || !/^(https?|file):$/.test(u.protocol)) return;
  document.write('<script src="' + u.href.replace(/["<>]/g, "") + '"><\/script>');
})();
</script>
<script src="transitions.js"></script>
<script src="app.js"></script>
</body>
</html>
